name: tests

# The three robobuilder repos ship prompt content, not a runtime, so the
# pytest suites are the only automated signal there is. Until this workflow
# existed they ran only when someone remembered to run them.

on:
  push:
    branches: ['**']
  pull_request:

# Push runs on every branch so a branch is tested before it has a PR. A PR from a
# branch in this repo was then tested twice (push + pull_request), doubling the
# org's Actions minutes. The pull_request run now only happens for forks, which
# get no push run here. A newer push cancels the older run of the same branch.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pyyaml
      - run: python -m pytest scripts/tests/ -q
      - name: Validate the plugin manifest
        run: |
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          python -m json.tool .claude-plugin/plugin.json > /dev/null

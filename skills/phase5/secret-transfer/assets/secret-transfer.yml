name: Secret Transfer (encrypted)
# Hands GitHub Actions secrets to ONE recipient machine without ever exposing them.
#
# - The recipient generates a keypair locally; only its PUBLIC certificate is passed in here.
# - The requested secrets are bundled as JSON and encrypted with OpenSSL CMS (RSA + AES-256-GCM).
# - The artifact is ciphertext only and expires after 1 day; only the recipient's private key can open it.
# - Secret values are never echoed. Only secret NAMES appear in logs.
#
# Normally run through scripts/secret-transfer/send.sh (robobuilder `secret-transfer` skill).
on:
  workflow_dispatch:
    inputs:
      secret_names:
        description: "Comma-separated GitHub secret names, e.g. MF_CLIENT_ID,MF_CLIENT_SECRET"
        required: true
        type: string
      recipient_cert:
        description: "Base64 of the recipient's PEM certificate (output of `secret-receive.py init`). Public, safe to share."
        required: true
        type: string

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      # Guardrails (fail closed). Configure with repo variables (see the secret-transfer skill):
      #   SECRET_TRANSFER_ALLOWED_ACTORS  comma-separated GitHub logins allowed to trigger transfers
      #   SECRET_TRANSFER_ALLOWED_CERTS   comma-separated SHA-256 fingerprints of approved recipients
      - name: Check who, where from, and to whom
        env:
          ALLOWED_ACTORS: ${{ vars.SECRET_TRANSFER_ALLOWED_ACTORS }}
          ALLOWED_CERTS: ${{ vars.SECRET_TRANSFER_ALLOWED_CERTS }}
          ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          CERT_B64: ${{ inputs.recipient_cert }}
          NAMES: ${{ inputs.secret_names }}
        run: |
          set -euo pipefail
          norm() { tr ',' '\n' | tr -d ' \r' | tr '[:lower:]' '[:upper:]' | grep -v '^$' || true; }
          if [ "$REF" != "$DEFAULT_REF" ]; then
            echo "::error::Transfers only run from the default branch ($DEFAULT_REF), not $REF"; exit 1; fi
          if ! printf '%s' "$ALLOWED_ACTORS" | norm | grep -qxF "$(printf '%s' "$ACTOR" | tr '[:lower:]' '[:upper:]')"; then
            echo "::error::$ACTOR is not in SECRET_TRANSFER_ALLOWED_ACTORS"; exit 1; fi
          printf '%s' "$CERT_B64" | base64 -d > recipient.pem
          fp=$(openssl x509 -in recipient.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if ! printf '%s' "$ALLOWED_CERTS" | tr -d ':' | norm | grep -qxF "$fp"; then
            echo "::error::Recipient certificate $fp is not in SECRET_TRANSFER_ALLOWED_CERTS"; exit 1; fi
          subject=$(openssl x509 -in recipient.pem -noout -subject)
          echo "Approved: actor=$ACTOR recipient=$fp ($subject)"
          {
            echo "### Secret transfer"
            echo "- Triggered by: \`$ACTOR\`"
            echo "- Recipient: \`$subject\` \`$fp\`"
            echo "- Secret names: \`$(printf '%s' "$NAMES" | tr -cd 'A-Za-z0-9_, ')\`"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f recipient.pem

      - name: Encrypt requested secrets for the recipient
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          NAMES: ${{ inputs.secret_names }}
          CERT_B64: ${{ inputs.recipient_cert }}
        run: |
          set -euo pipefail
          umask 077

          # 1. Recipient certificate (public). Refuse anything that is not an RSA >= 3072-bit cert.
          printf '%s' "$CERT_B64" | base64 -d > recipient.pem
          openssl x509 -in recipient.pem -noout -subject -fingerprint -sha256
          bits=$(openssl x509 -in recipient.pem -noout -pubkey | openssl pkey -pubin -noout -text | sed -nE 's/.*\(([0-9]+) bit\).*/\1/p')
          if [ -z "$bits" ] || [ "$bits" -lt 3072 ]; then echo "Recipient key must be RSA >= 3072 bits (got: ${bits:-unknown})"; exit 1; fi

          # 2. Validate requested names (names only — values are never printed).
          names=$(printf '%s' "$NAMES" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | unique')
          echo "$names" | jq -e 'length > 0 and all(test("^[A-Z0-9_]+$"))' > /dev/null \
            || { echo "secret_names must be a comma-separated list of UPPER_SNAKE_CASE names"; exit 1; }
          missing=$(jq -rn --argjson n "$names" '(env.ALL_SECRETS | fromjson | keys) as $have | $n - $have | join(",")')
          if [ -n "$missing" ]; then echo "Not found in repo secrets: $missing"; exit 1; fi

          # 3. Bundle and encrypt in one pipe (plaintext never touches disk).
          jq -n --argjson n "$names" '
            (env.ALL_SECRETS | fromjson) as $s
            | { format: "secret-transfer/v1",
                created_at: (now | todate),
                run_id: env.GITHUB_RUN_ID,
                secrets: ($s | with_entries(select(.key as $k | $n | index($k)))) }' \
            | openssl cms -encrypt -binary -aes-256-gcm -outform DER -out secrets.cms recipient.pem

          echo "Encrypted for recipient: $(echo "$names" | jq -r 'join(", ")')"
          echo "Ciphertext size: $(stat -c %s secrets.cms) bytes"

      - name: Upload ciphertext
        uses: actions/upload-artifact@v4
        with:
          name: secrets-encrypted
          path: secrets.cms
          retention-days: 1
          if-no-files-found: error
